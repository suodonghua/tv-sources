name: 源自动择优

on:
  schedule:
    # 每天北京时间 03:17 跑一次（UTC 19:17，错开整点避免 Actions 排队高峰）
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新选源（忽略切换阈值）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: source-opt
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 扫描候选源并择优
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_DIRECT: '1'
          FORCE_SWITCH: ${{ inputs.force && '1' || '' }}
        run: python sourceopt/scan.py

      - name: 发布结果
        run: |
          set -e
          cp -r sourceopt/out/. .
          rm -rf sourceopt/out
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本轮无变化"
          else
            git commit -m "chore: 自动择优 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 汇总
        run: |
          echo "### 源择优结果" >> $GITHUB_STEP_SUMMARY
          cat sourceopt/REPORT.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "无报告"
